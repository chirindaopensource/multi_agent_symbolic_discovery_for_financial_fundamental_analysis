  raw_feature_columns:  # raw L1 fundamentals whose training statistics Task 7 freezes
    - "is_revenue_ttm"
    - "is_ebitda_ttm"
    - "is_ebit_ttm"
    - "is_net_income_ttm"
    - "bs_total_equity"
    - "cf_free_cash_flow_ttm"
    - "cf_operating_cash_flow_ttm"
    - "bs_total_debt"
    - "bs_cash_and_equivalents"
    - "bs_total_assets"
    - "is_rd_expense_ttm"
