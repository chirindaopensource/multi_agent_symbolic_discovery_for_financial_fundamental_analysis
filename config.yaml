  # SECTION 27.0 — METHODOLOGICAL NOTES
  methodological_notes:
    note_1_shared_target: "Every specialist is scored against the SAME look-ahead price target. Perspective disentanglement lives in the PROMPT PRIOR, not in the objective."
    note_2_two_lossy_channels: "Cross-perspective information travels as scalar losses and prediction vectors; memory-to-policy information travels as natural-language prose. Both channels are lossy and non-invertible."
    note_3_price_level_target: "The target is a PRICE LEVEL, not a return. No portfolio-level or risk-adjusted validation is performed in the paper; no economic claim is therefore established."
    note_4_interpretability_circularity: "Because perspectives are prompt-imposed, correspondence between learned equations and canonical valuation forms is partly induced by the prior. The genuine finding is the DEFORMATION of canonical forms by data; the shuffled-prior control is the correct test."
    note_5_coefficient_non_interpretability: "Raw-scale regressors yield dimensionally arbitrary fitted constants. Only STRUCTURE is interpretable; coefficients are not. Standardisation inside the DE fitter mitigates but does not eliminate this."
    note_6_oracle_infeasibility: "The oracle single-agent ablation is not a deployable strategy; its catastrophic Russell 2000 degradation demonstrates that combination, not selection, is the correct primitive."
    note_7_context_conditioning_duplicated: "Context enters via the coordinator AND via learned indicator switches inside the specialists. This redundancy is neither ablated nor discussed in the paper."
    note_8_regime_causality_unspecified: "The paper never states whether regime labels are causal at t or ex-post. Peak/trough dating is normally confirmatory. Implement both; treat the causal variant as primary."
    note_9_release_without_locator: "Artifacts are promised at four separate points but no repository locator is provided anywhere. All released artifacts must be transcribed from Appendices C, D, and E."
    note_10_stochasticity_unquantified: "Single runs on a single four-billion-parameter backbone with no seed replicates leaves the headline point estimates without uncertainty quantification."
    note_11_compute_parity_unstated: "No compute-parity statement is provided versus PySR, LLM-SR, or FunSearch, though MUFASA is strictly more elaborate."
    note_12_licensing_boundary: "Fundamentals come from a licensed commercial vendor and macro from a second licensed vendor. A reproduction can replicate the methodology exactly but cannot verify that its data is bit-identical."
  # SECTION 28.0 — VERIFICATION GATES
  verification_gates:
    gate_0_panel_internal_consistency:  # [REVISED: Added]
      checks:
        - "accounting_identity_holds_for_every_row_within_tolerance"
        - "target_date_strictly_greater_than_filing_date_original"
        - "market_cap_reconciles_with_price_times_shares_within_2pct"
        - "target_forward_shift_lock_enforced"
        - "membership_intervals_unique_per_issuer_per_index"
        - "split_adjustment_basis_date_precedes_observation_date"
    gate_1_arithmetic_self_consistency:
      checks:
        - "sum_of_17_margins / 17 == 0.3702"
        - "each AvgDelta == mean of its own five gaps"
        - "each AllData == mean of its own five market values"
        - "RandomForest margin == 0.1498"
        - "HistGBM margin == 0.3644"
    gate_2_headline_percentages:
      checks: ["reduction_vs_better_agentic == 27.67%"]
      disclosures_required: "State the reference and aggregation used for the 19.65% claim; neither pooled-vs-PySR (20.00%) nor mean-per-market-vs-PySR (19.47%) reproduces it exactly. Report the computed value under the reproduction's own aggregation basis."
    gate_3_structural_recovery:
      checks:
        - "each perspective recovers its canonical family"
        - "Earnings equations contain base x multiple x growth"
    gate_4_learning_content_recovery:
      checks:
        - "instability failures dominate"
        - "instability conditional on firm type and sector"
        - "directional bias sector-specific"
        - "variables re-composed not discarded"
    gate_5_ablation_directional_pattern:
      checks:
        - "full beats single-perspective on >=4/5 markets"
        - "meta-coordinator beats equal weights on >=4/5 markets"
        - "best-single-agent degrades severely at least once"
        - "full statistical memory beats binary and MAPE-only on >=4/5 markets"
    gate_6_diagnostic_pattern:
      checks:
        - "best-MAPE SR baseline is NOT best-Spearman SR baseline"
        - "MUFASA attains highest Spearman among SR methods"
    gate_7_weight_matrix_economics:
      checks:
        - "earnings-heavy in stable-profitability sectors"
        - "asset/cashflow-heavy in balance-sheet-heavy sectors"
        - "qualitative pattern recurs across >=3/5 markets"
    gate_8_sensitivity_battery:
      checks:  # [REVISED: Added]
        - "5-seed median and IQR reported"
        - "retrieval depth sweep reported"
        - "memory cap sweep reported"
        - "weight constraint toggle reported"
        - "regime causality toggle reported"
        - "aggregation order sweep reported"
        - "parsimony toggle reported"
        - "shuffled-prior control reported"
        - "inter-specialist communication variant reported"
  # SECTION 29.0 — SYNTHESIS
  synthesis:
    specified_share_estimate: "approximately one third of the parameter surface"
    reconstructed_share_estimate: "approximately two thirds"
    most_consequential_parameter: "aggregation_order_primary"
    most_consequential_reason: "It is the only parameter whose misspecification can silently account for the internal inconsistency between the headline table and the significance table under a single metric name."
    most_consequential_raw_structure: "The codebook-and-taxonomy pair, because those two artifacts silently determine whether cross-sectional aggregates, sector-conditional weights, and cross-market comparisons are actually comparable."
    fidelity_boundaries:
      - "No repository locator; artifacts transcriptable only from appendices."
      - "Fundamentals and macro are licensed; no redistributable extract."
    final_honesty_statement: "This dictionary is the complete configuration surface as far as the paper permits. Every entry carries a provenance tag. Entries tagged [UNSPECIFIED IN MANUSCRIPT] are reproduction decisions and MUST be reported as such alongside any claim of replication. Entries tagged [ABSENT] record confirmed omissions and cannot be reconstructed except by decision. No reproduction claim should be made without resolving all four internal conflicts, passing all nine verification gates, and publishing the gap-decision register verbatim."
