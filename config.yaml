# TASK 3 — index registry, membership history and configuration consistency
# ============================================================================
market_structure:
  study:
    index_ticker_map:  # [REVISED: Verified] L3 ticker_map_reconstruction
      SP500: "^GSPC"
      RUSSELL2000: "^RUT"
      STOXX600: "^STOXX"
      FTSE_APAC_EX_JP: null
      CSI300: "000300.SS"
    index_ticker_verified: {SP500: 1, RUSSELL2000: 1, STOXX600: 1, FTSE_APAC_EX_JP: null, CSI300: 1}
    index_placeholder_market: "FTSE_APAC_EX_JP"  # FTSE leg resolved from ftse_candidate_symbols
    index_pre_verified_tickers: ["^GSPC", "^RUT", "^STOXX", "000300.SS"]
    index_ticker_currency: {SP500: "USD", RUSSELL2000: "USD", STOXX600: "EUR", FTSE_APAC_EX_JP: "USD", CSI300: "CNY"}
    study_window: {start: "1990-01-01", end: "2025-12-31"}  # [SPECIFIED §4] union of the five market spans
    conflict_resolutions:  # study_specification.internal_conflicts
      conflict_1_memory_contents: "table_1_seven_family"
      conflict_2_weight_generation: ["slsqp_constrained", "sampled_from_policy"]
      conflict_3_loss_definition: "pooled_vs_per_quarter_reconciliation_scheduled"
      conflict_4_ablation_cells: "run_to_run_variance_or_rounding"
    weight_generation:  # [SPECIFIED §3.3 / Alg. 2] both mechanisms; the match is confirmed by Task 21's comparison
      mechanisms: ["slsqp_constrained", "sampled_from_policy"]
      released_matrix_match: "slsqp_constrained"
    diagnostics:
      loss_aggregation_reconciliation: {scheduled: true, skippable: false}
    ablation:
      scheduled: true
      memory_regime_grid_variants: ["BINARY_PASS_FAIL", "MAPE_ONLY", "FULL_STATISTICAL"]
      best_single_agent_alignment_strategies: ["calendar_quarter", "fiscal_quarter"]
      russell2000_cells:
        - "single_perspective_full_stat_russell"
        - "equal_weights_full_stat_russell"
        - "best_single_agent_full_stat_russell"
      notes: "Table 3 versus Table 10 Russell 2000 cells disagree; cause [UNSPECIFIED IN MANUSCRIPT]"
    study: {notes: "Ticker of the FTSE Asia Pacific ex-Japan leg [UNSPECIFIED IN MANUSCRIPT]"}
  vendor_symbols: ["^GSPC", "^RUT", "^STOXX", "000300.SS", "^FTAPXJ", "^FTSEAPXJ", "FTAWXJ", "^FTASIAPXJ"]  # must be the vendor's live symbol list at extraction (operator supplied)
  conflicts_registry:
    conflict_1_memory_contents: "table_1_seven_family"
    conflict_2_weight_generation: ["slsqp_constrained", "sampled_from_policy"]
    conflict_3_loss_definition: "pooled_vs_per_quarter_reconciliation_scheduled"
    conflict_4_ablation_cells: "run_to_run_variance_or_rounding"
    ablation_required_variants:  # [SPECIFIED Table 10] required variant names of the two ablation families
      memory_regime_grid_variants: ["BINARY_PASS_FAIL", "MAPE_ONLY", "FULL_STATISTICAL"]
      best_single_agent_alignment_strategies: ["calendar_quarter", "fiscal_quarter"]
  gap_register:  # the two tagged notes (paths inside the Task 3 block) and every operational decision the manuscript leaves open
    - path: "ablation.notes"
      tag: "[UNSPECIFIED IN MANUSCRIPT]"
      decision: "recorded"
      justification: "Cause of the Table 3 versus Table 10 Russell 2000 disagreement is unpublished."
    - path: "study.notes"
      tag: "[UNSPECIFIED IN MANUSCRIPT]"
      decision: "recorded"
      justification: "No valid Yahoo Finance symbol is published for FTSE Asia Pacific ex-Japan."
    - path: "pipeline.serving.model_revision"
      tag: "[UNSPECIFIED IN MANUSCRIPT]"
      decision: "recorded"
      justification: "Model revision of Qwen3-4B-Thinking is not published; it must be pinned to a 40-hex commit before a licensed run."
    - path: "market_structure.study.index_ticker_map.FTSE_APAC_EX_JP"
      tag: "[UNSPECIFIED IN MANUSCRIPT]"
      decision: "recorded"
      justification: "No valid Yahoo Finance symbol is published for FTSE Asia Pacific ex-Japan; resolved from ftse_candidate_symbols by Task 3."
    - path: "pipeline.max_iterations"
      tag: "[UNSPECIFIED IN MANUSCRIPT]"
      decision: "recorded"
      justification: "Specialist iterations per agent (50) are not published."
    - path: "pipeline.coordinator_iterations"
      tag: "[UNSPECIFIED IN MANUSCRIPT]"
      decision: "recorded"
      justification: "Meta-coordinator iterations per context (30) are not published."
    - path: "pipeline.differential_evolution"
      tag: "[UNSPECIFIED IN MANUSCRIPT]"
      decision: "recorded"
      justification: "Differential-evolution population, generations, crossover, weight, bounds and early stop are not published."
    - path: "pipeline.min_cell_occupancy"
      tag: "[UNSPECIFIED IN MANUSCRIPT]"
      decision: "recorded"
