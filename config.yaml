  perspective_assignment: null
  cross_perspective_learnings: null
# ============================================================================
# TASKS 23 TO 26 — the 17 baselines of Table 2 and the naive benchmarks
# ============================================================================
baselines:
  ml:  # study_specification.training_parameters.baseline_training
    non_feature_columns: ["px_close_period_end", "issuer_id"]
    rf: {n_estimators: 500, max_features: "sqrt", min_samples_leaf: 1}
    histgbm: {learning_rate: 0.1, max_iter: 200, max_leaf_nodes: 31, min_samples_leaf: 20, max_bins: 255}  # Task 23 accepts exactly these five settings and runs the declared iterations in full (early stopping is forced off)
    nn: {hidden_size: 64, max_epochs: 200, learning_rate: 0.001}  # [UNSPECIFIED IN MANUSCRIPT] one hidden ReLU layer of 64 units, Adam 1e-3, 200 epochs
  symbolic:
    budgets: {funsearch: 30, llm_sr: 30}  # [UNSPECIFIED IN MANUSCRIPT] matched to PySR's 30 iterations
    differential_evolution:
      population_multiplier: 15
      generations_max: 200
      crossover_rate: 0.7
      differential_weight: 0.5
      parameter_bounds: [-1000000.0, 1000000.0]
      early_stop_patience: 20
      early_stop_tolerance: 1.0e-06
      admissible_share_floor: 0.5
  llm:
    models: ["Fin-R1", "Fino1"]  # [SPECIFIED §4] Fin-R1 and Fino1
    allowed_fields:  # prompt whitelist; the target is never whitelisted
      - "EPS_TTM"
      - "NI_ps"
      - "BVPS"
      - "TBVPS"
      - "FCF_ps"
      - "OCF_ps"
      - "EBITDA_ps"
      - "EBIT_ps"
      - "Revenue_ps"
      - "Debt_ps"
      - "P_E"
      - "P_B"
      - "EV_EBIT"
      - "EV_EBITDA"
    erp: 0.05  # [UNSPECIFIED IN MANUSCRIPT] equity risk premium of the single-stage Gordon models
  naive:
    framework_timeout_s: 300
    feature_policy: "task_23_v1"
    frameworks: ["fincon", "finvision"]  # [SPECIFIED §4] FinCon and FinVision
    framework_adapters:
      fincon: "notebook:builtin_framework_adapter"
      finvision: "notebook:builtin_framework_adapter"
    framework_entry_points: {}  # operator declares 'package.module:function' per framework; absent = registered unavailable
