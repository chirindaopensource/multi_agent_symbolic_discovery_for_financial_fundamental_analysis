  market_registry:
    SP500:
      index_name: "S&P 500"  # [SPECIFIED §4]
      span_start: "1990Q1"  # [SPECIFIED §4]
      span_end: "2023Q2"
      quarters_approx: 134
      train_quarters_approx: 107
      test_quarters_approx: 27
      index_ticker_verified: "^GSPC"  # [REVISED: Verified]
      reporting_currencies_typical: ["USD"]
      trading_currency: "USD"
    RUSSELL2000:
      index_name: "Russell 2000"  # [SPECIFIED §4]
      span_start: "1990"  # [SPECIFIED §4]
      span_end: "2025"
      quarters_approx: 144
      train_quarters_approx: 115
      test_quarters_approx: 29
      index_ticker_verified: "^RUT"  # [REVISED: Verified]
      trading_currency: "USD"
    STOXX600:
      index_name: "STOXX 600"  # [SPECIFIED §4]
      span_start: "1995"  # [SPECIFIED §4]
      span_end: "2025"
      quarters_approx: 124
