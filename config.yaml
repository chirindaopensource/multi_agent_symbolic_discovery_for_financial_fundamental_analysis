# ==============================================================================#
#
#  Self-Evolving Multi-Agent Symbolic Discovery for Financial Fundamental
#  Analysis (MUFASA) — Study Configuration (config.yaml)
#
#  This file is the complete study configuration of the production-grade
#  implementation of "Self-Evolving Multi-Agent Symbolic Discovery for
#  Financial Fundamental Analysis" by Kelvin J.L. Koa, Filip Orestav,
#  Shengqiong Wu, Michael J. Wooldridge and Ke-Wei Huang (2026). It carries
#  every setting the top-level driver `run_task_36` and its 35 stages read
#  for a licensed run, beside the full fused study dictionary that documents
#  the provenance of every parameter. `study_config.json` holds exactly the
#  same mapping and is the file the driver loads.
#
#  Layout:
#  • config_metadata      — title, version, author and run-time contract
#  • validation           — Task 2: firm-quarter and macro schemas, arithmetic
#  • market_structure     — Task 3: index registry, membership, conflicts, gaps
#  • cleaning             — Task 4: ratio specifications and Gate 0 thresholds
#  • macro                — sovereign yields joined by (market, quarter)
#  • pipeline             — Task 22: discovery pipeline (Tasks 5 to 21)
#  • baselines            — Tasks 23 to 26: the 17 baselines and naive models
#  • evaluation           — Tasks 27 to 29: metrics, inference, scorecard
#  • ablation             — Task 30: perspective ablation, Tables 3 and 10
#  • memory_ablation      — Tasks 31 and 32: memory-regime ablation
#  • sensitivity          — Task 33: extended sensitivity grid
#  • robustness           — Task 34: shuffled prior, battery, communication
#  • packaging            — Task 35: artefacts and publication package
#  • study_specification  — sections 1.0 to 29.0 of the fused dictionary
#
#  Run-time contract:
#  • Save as study_config.json in MUFASA_STUDY_DATA_DIR beside the five raw
#    panel pickles (fundamental_quarter, macro_quarter, index_daily,
#    index_membership, classifications); run_study_execution then loads it.
#  • The 'environment' block is composed at run time from the declared
#    environment and the measured provenance; it is never written by hand.
#  • Seeds are an argument of run_task_36 (11, 23, 41, 67, 101).
#  • Values tagged [UNSPECIFIED IN MANUSCRIPT] are reproduction decisions and
#    are listed in market_structure.gap_register.
#  • Before a licensed run: pin pipeline.serving.model_revision, verify the
#    FTSE Asia Pacific ex-Japan symbol and supply the vendor symbol list.
#
#  Paper Reference:
#  Koa, K. J. L., Orestav, F., Wu, S., Wooldridge, M. J., & Huang, K.-W.
#  (2026). Self-Evolving Multi-Agent Symbolic Discovery for Financial
#  Fundamental Analysis. arXiv preprint arXiv:2609.32746.
#  https://arxiv.org/abs/2609.32746
#
#  Author: CS Chirinda
#  License: MIT
#  Version: 1.1.0
#
# ==============================================================================#

# ============================================================================
# METADATA (the JSON file's equivalent of this header)
# ============================================================================
config_metadata:
  title: "MUFASA study configuration for run_task_36"
  paper: "Koa, Orestav, Wu, Wooldridge and Huang (2026), Self-Evolving Multi-Agent Symbolic Discovery for Financial Fundamental Analysis, arXiv:2609.32746"
  author: "CS Chirinda"
  version: "1.1.0"
  license: "MIT"
  data_mode: "licensed"
  consumer: "run_study_execution reads this file as study_config.json from MUFASA_STUDY_DATA_DIR beside the five raw panel pickles, adds the measured 'environment' block and calls run_task_36."
  environment_block: "not stored here: built at run time by build_environment_task_36 from STUDY_ENVIRONMENT_DECLARATION and the measured provenance."
  seeds: "passed to run_task_36 as an argument (STUDY_SEED_LIST = [11, 23, 41, 67, 101]); mirrored in study_specification.reproducibility.seed_values."
  tuples: "tuples of the study dictionary are stored as lists."
