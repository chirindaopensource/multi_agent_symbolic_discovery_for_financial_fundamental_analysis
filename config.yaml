    - path: "pipeline.memory_cap"
      tag: "[UNSPECIFIED IN MANUSCRIPT]"
      decision: "recorded"
      justification: "The 500-record memory cap and its recent-and-best eviction are not published."
    - path: "reproduction_target.seed_values"
      tag: "[UNSPECIFIED IN MANUSCRIPT]"
      decision: "recorded"
      justification: "The five seeds 11, 23, 41, 67, 101 are reproduction decisions."
    - path: "baselines.llm.erp"
      tag: "[UNSPECIFIED IN MANUSCRIPT]"
      decision: "recorded"
