    regime_causal_primary: true  # [REVISED: Clarified] — causal construction is the primary; ex-post is a robustness check
    regime_ex_post_variant_enabled: true  # [REVISED: Added]
    regime_causality_note: "Peak/trough dating in this family is normally confirmatory. An ex-post construction would leak future information into the weight matrix. The causal (running-extremum) construction is the primary; the ex-post variant is run only as a robustness specification."  # [REVISED: Clarified]
  # SECTION 8.0 — EQUATION REGISTRY
  equations_numbered:
    eq_1_discovery_objective:
      paper_number: 1
      location: "Section 3.1"
      latex: "\\tilde{f}_{C(i,t)}(\\hat{x}_{i,t}) \\approx y_{i,t+1}, \\quad \\forall i, t"
      role: "master objective"
    eq_2_agent_prediction:
      paper_number: 2
      location: "Section 3.2"
      latex: "\\hat{y}_{i,t+1}^{(a)} = \\tilde{f}^{(a)}\\left(\\mathbf{x}_{i,t}^{(a)}\\right)"
      role: "per-perspective forward pass"
    eq_3_agent_fitness:
      paper_number: 3
      location: "Section 3.2"
      latex: "\\mathcal{L}^{(a)} = \\text{MAPE}\\left(\\hat{y}_{i,t+1}^{(a)}, y_{i,t+1}\\right)"
      role: "per-perspective objective"
    eq_4_hierarchical_aggregation:
      paper_number: 4
      location: "Section 3.3"
      latex: "\\hat{y}_{i,t+1} = \\tilde{\\mathbf{w}}_{C(i,t)}^\\top \\cdot \\hat{\\mathbf{y}}_{i,t+1}"
      role: "context-conditional aggregation"
    eq_5_meta_fitness:
      paper_number: 5
      location: "Section 3.3"
      latex: "\\mathcal{L}^{\\text{meta}} = \\text{MAPE}\\left(\\hat{y}_{i,t+1}, y_{i,t+1}\\right)"
      role: "meta-coordinator objective"
    eq_6_andrews_bandwidth:
      paper_number: 6
      location: "Appendix B"
      latex: "L = \\left\\lfloor 4 \\left( \\frac{T}{100} \\right)^{2/9} \\right\\rfloor"
      role: "HAC bandwidth for DM test"
  equations_unnumbered:
    context_definition: {latex: "C(i,t) = (s(i), r(t))", location: "Section 3.1"}
    hypothesis_sampling: {latex: "\\tilde{f}^{(a)} \\sim \\pi_\\theta(\\cdot \\mid p^{(a)})", location: "Section 3.2"}
    variable_selection_constraint: {latex: "x_{i,t} \\subseteq \\mathcal{X}_t", location: "Section 3.1"}
  theory_reference_equations:
    earnings_multiple: {latex: "EPS \\cdot PE"}
    gordon_growth: {latex: "\\frac{EPS}{r - g}"}
    discounted_cash_flow: {latex: "\\sum_{t=1}^{\\infty} \\frac{FCF_t}{(1+r)^t}"}
    book_multiple: {latex: "BVPS \\cdot PB"}
    relative_valuation: {latex: "\\text{Metric} \\cdot \\text{Metric}"}
    residual_income: {latex: "BV + \\sum_{t=1}^{\\infty} \\frac{(ROE_t - r) \\cdot BV_{t-1}}{(1+r)^t}"}
    linear_factor: {latex: "R_i = \\alpha + \\beta_1 X_{1,i} + \\beta_2 X_{2,i} + \\cdots"}
    revenue_growth: {latex: "\\text{Revenue}_0 \\cdot (1 + g)"}
  # SECTION 9.0 — ALGORITHM REGISTRY
  algorithms:
    algorithm_1:
      paper_label: "Algorithm 1"
      caption: "Philosophy Agent Training"
      location: "Appendix A"
      require:
        llm: "pi_theta"
        database: "X_t"
        targets: "y_(i,t+1)"
        perspective: "a"
        memory: "M_a"
        learnings: "Z_a"
      initialisation: {seed_call: "SeedEquation(a)", initial_loss: "MAPE(seed(x), y)"}
      iteration_count: 50  # [UNSPECIFIED IN MANUSCRIPT] — placeholder; early stop at 10-iteration no-improvement
      early_stop_patience: 10  # [UNSPECIFIED IN MANUSCRIPT]
      early_stop_tolerance: 0.001  # [UNSPECIFIED IN MANUSCRIPT]
      hypothesis_generation:  # [SPECIFIED §4] | [REVISED: Added]
        temperature: 0.7
        grammar_validation_required: true
        max_resample_on_invalid: 3
        grammar_specification: "see_prompt_registry_grammar"
      data_retrieval: {call: "Retrieve(X_t)", error_branch: true, feedback_append: true}
      code_evaluation:  # [REVISED: Added]
        call: "Evaluate(expression, variables)"
        error_branch: true
        failure_types: ["syntax_error", "invalid_operation", "non_finite_output", "indicator_of_nan"]
      hypothesis_optimization: {delegated_to: "differential_evolution"}
      memory_update: {resolution: "follow_Table_1_seven_families"}  # [REVISED: Clarified] — Algorithm 1 line 20 says (expr, scalar); Table 1 mandates seven families; Table 1 wins
      learnings_update: {call: "UpdateLearnings(M_a)", temperature: 0.3}
      return: "final_best_expression"
    algorithm_2:
      paper_label: "Algorithm 2"
      caption: "Meta-Coordinator Training"
      location: "Appendix A"
      outer_loop: "for_all_C(i,t)"
      n_context_cells_max: 22
      weight_init: {call: "InitWeights()", value: "1/K"}
      inner_iteration_count: 30  # [UNSPECIFIED IN MANUSCRIPT] — placeholder
      weight_generation_prose:
        mechanism: "SLSQP_constrained_optimisation"  # [SPECIFIED §3.3]
        citation: "Kraft (1988)"
        constraints: {non_negativity: true, sum_to_one_simplex: true}
        feasibility_tolerance: 1.0e-08  # [UNSPECIFIED IN MANUSCRIPT]
        max_iterations: 500  # [UNSPECIFIED IN MANUSCRIPT]
      weight_generation_pseudocode: {mechanism: "sample_from_policy", operator: "wtilde ~ pi_phi(· | p_meta)"}  # [SPECIFIED Alg.2 line 8]
      both_variants_required: true  # [REVISED: Clarified]
      variant_identification_rule: "match_released_weight_matrices"
      aggregation_call: "wtilde^T · yhat_vector"
      meta_loss_call: "MAPE(aggregated, target)"
      return: "weight_vector_per_context"
    # 9.3 Differential evolution
    differential_evolution:
      algorithm: "DIFFERENTIAL_EVOLUTION"  # [SPECIFIED §3.2]
      citation: "Storn & Price (1997)"  # [CITED]
      structure_proposed_by: "LLM"
      coefficients_fitted_by: "DE"
      objective_metric: "MAPE"
      population_size_rule: "15 * n_free_parameters"  # [UNSPECIFIED IN MANUSCRIPT]
      generations_max: 200  # [UNSPECIFIED IN MANUSCRIPT]
      crossover_rate: 0.7  # [UNSPECIFIED IN MANUSCRIPT]
      differential_weight: 0.5  # [UNSPECIFIED IN MANUSCRIPT]
      parameter_bounds: [-1000000.0, 1000000.0]  # [UNSPECIFIED IN MANUSCRIPT]
      initialisation: "random_uniform_within_bounds"  # [UNSPECIFIED IN MANUSCRIPT]
      early_stop_patience: 20  # [UNSPECIFIED IN MANUSCRIPT]
      early_stop_tolerance: 1.0e-06  # [UNSPECIFIED IN MANUSCRIPT]
      # REVISED: Added feature-conditioning pass to counter the paper's observed extreme
      # fitted constants (13829.10, 34086.20, 852.52, 809734.00) that are artefacts of
      # raw-scale regressors under wide DE bounds.
      feature_standardisation_inside_fitter: true  # [REVISED: Added]
      feature_standardisation_rule: "Standardise regressors to zero-mean unit-variance using training statistics before the DE fit; unscale fitted coefficients afterward. This produces comparable coefficient magnitudes across markets and reduces DE ill-conditioning without altering the structural form."
      parsimony_penalty_in_objective: false  # [UNSPECIFIED IN MANUSCRIPT] — paper uses pure MAPE; register choice to add
    # 9.4 SLSQP
    slsqp_weight_optimiser:
      algorithm: "SLSQP"  # [SPECIFIED §3.3]
      citation: "Kraft (1988)"
      constraint_non_negativity: true  # [IMPLIED]
      constraint_sum_to_one: true  # [IMPLIED]
      initial_point_source: "meta_LLM_proposal"
      feasibility_tolerance: 1.0e-08  # [UNSPECIFIED IN MANUSCRIPT]
      optimality_tolerance: 1.0e-10  # [UNSPECIFIED IN MANUSCRIPT]
      max_iterations: 500  # [UNSPECIFIED IN MANUSCRIPT]
      objective_metric: "MAPE"
    # 9.5 Semantic retrieval
    semantic_retrieval_procedure:
      mechanism: "semantic_similarity_lookup"  # [SPECIFIED §3.2]
      query_input: "variable_names_implied_by_expression"
      index_content: "variable_names_and_descriptions"
      embedding_model_type: "sentence_transformer"  # [UNSPECIFIED IN MANUSCRIPT]
      similarity_metric: "cosine"  # [UNSPECIFIED IN MANUSCRIPT]
      top_k_candidates: 20  # [UNSPECIFIED IN MANUSCRIPT]
      top_k_sensitivity_values: [5, 10, 20]  # [REVISED: Added]
      coverage_threshold: 0.8  # [UNSPECIFIED IN MANUSCRIPT]
      failure_mode: "structured_error_feedback"  # [SPECIFIED §3.2]
      # REVISED: Added mandatory retrieval-quality pre-flight test.
      preflight_paraphrase_test_required: true  # [REVISED: Added]
      preflight_test_design: "Hand-curate at least 50 paraphrase queries whose ground-truth targets are known codebook variables. Verify that the intended variable is recovered in the top-k for at least 90% of queries. Fail the pipeline if quality is below this threshold."
      preflight_pass_threshold: 0.9  # [REVISED: Added]
    # 9.6 Code execution
    code_execution_procedure:
      mechanism: "compile_and_execute"  # [SPECIFIED §3.2]
      input: ["candidate_expression", "retrieved_variables"]
      output_on_success: "prediction_vector"
      output_on_failure: "structured_error_feedback"
      detected_failure_types: ["syntax_errors", "invalid_operations", "non_finite_outputs", "indicator_of_nan"]  # [REVISED: Added] — 1{NaN > 0} produces NaN, not False
      sandbox_runtime: "python_like"  # [UNSPECIFIED IN MANUSCRIPT]
      timeout_seconds_per_candidate: 30  # [UNSPECIFIED IN MANUSCRIPT]
      nonfinite_tolerance: 1.0e-300  # [UNSPECIFIED IN MANUSCRIPT]
      invalid_operation_examples:  # [REVISED: Added]
        - "division_by_zero"
        - "log_of_nonpositive"
        - "negative_base_fractional_exponent"
        - "comparison_with_nan"
      feedback_format:
        structure: "machine_parseable_text"
        reason_codes:
          - "INSUFFICIENT_COVERAGE"
          - "SYNTAX_ERROR"
          - "INVALID_OPERATION"
          - "NON_FINITE_OUTPUT"
          - "VARIABLE_UNAVAILABLE"
          - "NAN_IN_INDICATOR"
        suggested_action_classes:  # [REVISED: Added]
          - "SUBSTITUTE_VARIABLE"
          - "REMOVE_TERM"
          - "CHANGE_OPERATION"
          - "REVISE_EXPRESSION"
          - "GUARD_INDICATOR"
    # 9.7 Statistical memory
    statistical_memory_procedure:
      memory_store_name: "M_a"
      meta_memory_store_name: "M_meta"
      append_rule: "per_evaluated_candidate"
      computation_partition_primary: "discovery_train"  # [UNSPECIFIED IN MANUSCRIPT] — default; can be set to validation
      computation_partition_secondary: "discovery_valid"
      schema_families:
        accuracy: ["mean_mape", "median_mape"]
        stability: ["standard_deviation", "interquartile_range", "coefficient_of_variation"]
        tail_risk: ["p90_error", "p95_error", "worst_decile_mean"]
        complexity: ["variable_count", "operator_count", "prediction_coverage"]
        bias: ["mean_signed_percentage_error"]
        ranking: ["spearman_rank_correlation"]
        calibration: ["signed_pct_error_by_price_quartile"]
      n_families: 7
      tail_percentiles: {p90: 90.0, p95: 95.0}
      worst_decile_fraction: 0.1
      quartile_count: 4
      mspe_definition: "mean_of_(predicted-actual)/actual"  # [IMPLIED]
      memory_cap_records: 500  # [UNSPECIFIED IN MANUSCRIPT]
      memory_eviction_rule: "recent_and_best"  # [UNSPECIFIED IN MANUSCRIPT]
      distillation_temperature: 0.3  # [SPECIFIED §4]
      distillation_schema_blocks:
        - "Summary"
        - "Key Insights"
        - "Statistical Diagnostics"
        - "What Works"
        - "What Fails"
        - "Important Variables"
        - "Agent Adaptation Behavior"
        - "Design Principle"
      n_schema_blocks: 8
      grounding_rule: "no_mechanism_beyond_supplied_statistics"
      variable_naming_requirement: "exact_codebook_symbol"
      expected_cross_agent_regularities:
        - "instability_failures_dominate_mean_accuracy_failures"
        - "instability_conditional_on_firm_type_and_sector"
        - "directional_bias_sector_specific"
        - "variables_composed_rather_than_discarded"
      overprediction_sector_observed: "Technology"
      underprediction_sector_observed: "Consumer Discretionary"
    # 9.8 Regime dating
    regime_dating_procedure:
      method: "peak_trough_threshold"  # [SPECIFIED §4]
      citation: "Pagan & Sossounov (2003)"
      bull_threshold_pct: 20.0
      bear_threshold_pct: 20.0
      bull_reference: "most_recent_trough"
      bear_reference: "most_recent_peak"
      price_series_frequency: "daily"  # [REVISED: Clarified]
      price_field_used: "close"  # [REVISED: Clarified]
      adjusted_close_used: false
      running_peak_update_rule: "causal_running_max"
      running_trough_update_rule: "causal_running_min"
      regime_forward_fill: true
      quarter_mapping_rule: "majority_of_days"  # [UNSPECIFIED IN MANUSCRIPT]
      causal_primary: true  # [REVISED: Clarified]
      ex_post_variant_run: true  # [REVISED: Added]
      minimum_regime_duration_days: null
      regime_timeline_hash_required: true  # [REVISED: Added] — provenance of the weight-matrix partition
    # 9.9 Diebold-Mariano test
    dm_test_procedure:
      test_name: "Diebold_Mariano"
      citation: "Diebold & Mariano (2002)"
      loss_function: "absolute_percentage_error"
      loss_differential_definition: "L_mufasa_minus_L_baseline"
      sign_convention: "negative_means_mufasa_better"
      variance_estimator: "Newey_West_HAC"
      kernel: "Bartlett"
      bandwidth_rule: "Andrews"
      bandwidth_formula: "floor(4 * (T/100)^(2/9))"
      small_sample_correction: "Harvey_Leybourne_Newbold"
      reference_distribution: "t_(T-1)"
      significance_markers: {"***": 0.001, "**": 0.01, "*": 0.05}
      n_pairwise_comparisons: 85
      aggregation_reconciliation_diagnostic: "Recompute the DM test under both pooled-per-firm-quarter losses and per-quarter-mean losses; identify which aggregation reproduces the paper's reported DM differentials; report both as sensitivity."  # [REVISED: Added]
      extensions_added:
        two_way_clustering: true  # [REVISED: Added]
        cluster_dimensions: ["firm", "quarter"]
        multiple_testing_control: true  # [REVISED: Added]
        fdr_method: "benjamini_hochberg"
        family_wise_alpha: 0.05
    # 9.10 Iteration control
    iteration_control:
      outer_loop_iterations: 50  # [UNSPECIFIED IN MANUSCRIPT]
      specialist_iterations_per_agent: 50  # [UNSPECIFIED IN MANUSCRIPT]
      meta_iterations_per_context: 30  # [UNSPECIFIED IN MANUSCRIPT]
      specialist_early_stop_patience: 10  # [UNSPECIFIED IN MANUSCRIPT]
      carry_forward_between_outer_iterations: true
      trajectory_logged: true
      trajectory_metric: "current_best_error"
      trajectory_partition: "training"  # [REVISED: Clarified] — Figure 3 converged values lie below reported test MAPE, so training-only
      trajectory_log_test_error_too: true  # [REVISED: Added]
