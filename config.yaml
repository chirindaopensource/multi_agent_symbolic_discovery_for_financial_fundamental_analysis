  # SECTION 11.0 — PROMPT TEMPLATES
  prompt_templates:
    specialist_prompt_blocks:
      PHILOSOPHY: "You are a fundamental valuation specialist working under the {perspective_name} philosophy.\n\nGROUNDING THEORY\n{theory_equation_latex}   [{theory_label}]\n\nPREFERRED VARIABLES\n{preferred_variables_list}\n\nSTRUCTURAL PATTERN ENCOURAGED\n{structural_pattern}\n\nDESIGN PRINCIPLE\n{design_principle}\n\nTASK: Propose exactly ONE symbolic expression estimating the stock price one fiscal quarter ahead. Every variable must appear verbatim in the provided codebook. Operators: {operator_whitelist}. Return the expression on the final line prefixed by 'EXPRESSION:'."
      PRIOR_EQUATION: "INCUMBENT: {incumbent_expression}\nSEED: {seed_expression}"
      LEARNINGS: "LEARNINGS:\n{distilled_learnings_text}\nObey every 'What Fails' item."
      ERROR_FEEDBACK: "FEEDBACK: failing_item={failing_item} reason={reason_code} coverage={coverage_observed} suggested_action={suggested_action_class}"
      ASSEMBLY_ORDER: ["PHILOSOPHY", "PRIOR_EQUATION", "LEARNINGS", "ERROR_FEEDBACK"]
    meta_prompt_blocks:
      CONTEXT: "CONTEXT: sector={sector_name} regime={regime_state}"
      AGENT_LOSSES: "SPECIALIST LOSSES: {agent_losses_block}"
      INCUMBENT_WEIGHTS: "INCUMBENT WEIGHTS: {incumbent_weights_block}"
      META_LEARNINGS: "META LEARNINGS: {meta_learnings_text}\nTASK: Select a SUBSET of perspectives and propose weights (non-negative, sum to 1)."
      ASSEMBLY_ORDER: ["CONTEXT", "AGENT_LOSSES", "INCUMBENT_WEIGHTS", "META_LEARNINGS"]
    agent_distillation_prompt: "ROLE: Statistical memory distiller for a valuation specialist.\n\nINPUT: {memory_records_block}\n\nCONSTRAINTS:\n1. Reference ONLY statistics present in the input above.\n2. Name variables by their EXACT codebook symbol.\n3. Do NOT assert any causal mechanism unsupported by a supplied statistic.\n4. Obey the output schema exactly.\n\nOUTPUT SCHEMA (eight blocks, in order):\nSummary:\nKey Insights:\nStatistical Diagnostics:\nWhat Works:\nWhat Fails:\nImportant Variables: (two-column table)\nAgent Adaptation Behavior:\nDesign Principle:"
    meta_distillation_prompt: "ROLE: Statistical memory distiller for the meta-coordinator.\n\nINPUT: {meta_memory_block}\n\nTASK: Summarise which perspectives receive weight in which contexts and why successful weight vectors succeeded.\n\nOUTPUT SCHEMA: eight blocks in the same order as above."
    # REVISED: Added formal grammar for LLM output to eliminate parser divergence.
    output_grammar:
      operators_allowed: ["+", "-", "*", "/", "^", "log", "exp", "abs", "<", ">", "indicator"]
      max_depth: 8
      max_operators: 30
      max_variables: 12
      argument_rule: "all arguments to log/exp must be positive on the training panel; otherwise the candidate is auto-rejected"
      constant_representation: "real-valued literals"
      variable_representation: "exact codebook symbol"
      indicator_syntax: "1{<condition>}"
      context_switches_allowed: true  # [IMPLIED] — released equations contain indicator switches
      grammar_enforcement_stage: "pre_retrieval_parse"
  # SECTION 12.0 — PROMPT ASSEMBLY AND TOKEN BUDGETS
  prompt_assembly:
    total_context_window_tokens: 32768
    max_generation_tokens: 16384
    effective_prompt_budget_tokens: 16384
    specialist_prompt_budget:
      PHILOSOPHY: 1500
      PRIOR_EQUATION: 3000
      LEARNINGS: 8000
      ERROR_FEEDBACK: 3000
      SLACK: 884
    meta_prompt_budget: {CONTEXT: 200, AGENT_LOSSES: 400, INCUMBENT_WEIGHTS: 200, META_LEARNINGS: 4000}
    distillation_output_budget_fraction: 0.8
    learnings_block_truncation_policy: "drop_complete_tail_blocks_only"  # [REVISED: Added] — never partial-truncate a block; the recurrent state must remain schema-complete
    learnings_block_truncation_note: "If the LEARNINGs block exceeds its 8,000-token budget, drop whole trailing blocks (Design Principle first, then Agent Adaptation Behavior, ...) rather than truncating mid-block. Partial truncation corrupts the schema and destabilises the next iteration."  # [REVISED: Added]
  # SECTION 13.0 — PERSPECTIVE AGENTS
  perspective_agents:
    Earnings:
      perspective_id: "A1"
      theory_label: "Gordon Growth"
      theory_equation_latex: "\\frac{EPS}{r - g}"
      preferred_variables: ["NI_ps", "EPS_TTM", "P_E", "SECTOR_MEDIAN_PE", "IS_EPS_GROWTH_YOY"]
      structural_pattern: "earnings base x earnings multiple x bounded growth adjustment"
      seed_equation: "NI_ps * SECTOR_MEDIAN_PE"  # [UNSPECIFIED IN MANUSCRIPT]
      sp500_learnt_example: "NI_ps * (1 + 0.01 * g_EPS) * PE * 0.88"
    "Cash Flow":
      perspective_id: "A2"
      theory_label: "Discounted Cash Flow"
      theory_equation_latex: "\\sum_{t=1}^{\\infty} \\frac{FCF_t}{(1+r)^t}"
      preferred_variables: ["FCF_ps", "OCF_ps", "EV_EBITDA", "SECTOR_MEDIAN_EV_EBITDA", "EV_FCF"]
      structural_pattern: "cash-flow base x sector-adjusted multiple"
      seed_equation: "FCF_ps * SECTOR_MEDIAN_EV_EBITDA"  # [UNSPECIFIED IN MANUSCRIPT]
      sp500_learnt_example: "FCF_ps * (EV/EBITDA) * (100/88.38)"
    Asset:
      perspective_id: "A3"
      theory_label: "Book Multiple"
      theory_equation_latex: "BVPS \\cdot PB"
      preferred_variables: ["BVPS", "TBVPS", "P_B", "SECTOR_MEDIAN_P_BOOK", "Assets", "Liabilities", "R&D"]
      structural_pattern: "book value x price-to-book x R&D-intensity adjustment"
      seed_equation: "BVPS * SECTOR_MEDIAN_P_BOOK"  # [UNSPECIFIED IN MANUSCRIPT]
      sp500_learnt_example: "BVPS * (1 + 1.01*R&D/Assets) * (1 - 13829.10*R&D/Assets) * (PB - 7.24e-4) / 1.34"
    Growth:
      perspective_id: "A4"
      theory_label: "Revenue Growth"
      theory_equation_latex: "\\text{Revenue}_0 \\cdot (1 + g)"
      preferred_variables: ["Revenue_ps", "SALES_REV_TURN_YOY", "P_FCF_mkt", "FCF_ps"]
      structural_pattern: "base x growth factor or market-relative multiple"
      seed_equation: "Revenue_ps * (1 + SALES_REV_TURN_YOY/100)"  # [UNSPECIFIED IN MANUSCRIPT]
      sp500_learnt_example: "(P/FCF)_mkt * (FCF_ps + 0.29 * (P/FCF)/(P/FCF)_mkt) * (1 - 14.80*(FCF_ps<1.08)) * 0.01"
    Quality:
      perspective_id: "A5"
      theory_label: "Residual Income"
      theory_equation_latex: "BV + \\sum_{t=1}^{\\infty} \\frac{(ROE_t - r) \\cdot BV_{t-1}}{(1+r)^t}"
      preferred_variables: ["NI_ps", "EBIT_ps", "P_FCF", "ROE", "OCF_ps", "Assets"]
      structural_pattern: "earnings base x cash-flow multiple x ROE adjustment"
      seed_equation: "NI_ps * P_FCF"  # [UNSPECIFIED IN MANUSCRIPT]
      sp500_learnt_example: "NI_ps * P/FCF * (1 + log(1+ROE/100)*0.87)"
    General_Single_Agent_Ablation: {perspective_id: "A0", theory_label: null, unified_search_space: true}
  # SECTION 14.0 — NETWORK ARCHITECTURE
  network_architecture:
    mufasa_topology:
      topology_class: "star_with_parallel_leaves"  # [IMPLIED]
      nodes:
        - "ENV"
        - "CTX"
        - "Phi_A1..Phi_A5"
        - "META"
        - "AGG"
        - "TOOL_R"
        - "TOOL_E"
        - "TOOL_O"
        - "TOOL_W"
        - "Mem_agent"
        - "Mem_meta"
        - "OUT"
      directed_edges_forward:
        - "(ENV, CTX)"
        - "(CTX, META)"
        - "(ENV, Phi_a) for all a"
        - "(Phi_a, TOOL_R)"
        - "(TOOL_R, Phi_a)"
        - "(TOOL_R, TOOL_E)"
        - "(TOOL_E, Phi_a)"
        - "(Phi_a, TOOL_O)"
        - "(TOOL_O, TOOL_E)"
        - "(TOOL_E, Mem_agent)"
        - "(Mem_agent, Phi_a)"
        - "(TOOL_E, META)"
        - "(META, TOOL_W)"
        - "(TOOL_W, AGG)"
        - "(CTX, AGG)"
        - "(Phi_a, AGG) for all a"
        - "(AGG, Mem_meta)"
        - "(Mem_meta, META)"
        - "(AGG, OUT)"
      absent_edges_architecturally_decisive: ["(Phi_a, Phi_b) for a != b — no specialist-to-specialist communication"]  # [IMPLIED] — inferred from Algorithm 1's lack of any such operation
      hub_node: "META"
      context_conditioning_duplicated_inside_specialists: true  # [IMPLIED]
      inter_specialist_variant_required_as_robustness: true  # [REVISED: Added] — the architecture's central claim is perspective dispersion; a communication variant is the most informative robustness check
    backbone_transformer:
      model_name: "Qwen3-4B-Thinking"  # [SPECIFIED §4]
      n_layers: null  # [ABSENT]
      hidden_dim: null  # [ABSENT]
      n_attention_heads: null  # [ABSENT]
      attention_variant: null  # [ABSENT]
      vocab_size: null  # [ABSENT]
      activation: null  # [ABSENT]
      norm_type: null  # [ABSENT]
      rope_theta: null  # [ABSENT]
      context_window_tokens: 32768
      max_generation_tokens: 16384
      precision: "bfloat16"  # [UNSPECIFIED IN MANUSCRIPT]
    tool_architecture:
      retrieval_tool: {input_channel: "variable_name_set", output_channel: "design_matrix", stateful: false}
      execution_tool:
        input_channel: ["expression", "design_matrix"]
        output_channel: ["prediction_vector", "structured_error"]
        stateful: false
        sandboxed: true
      coefficient_optimiser:
        input_channel: ["fixed_structure", "design_matrix"]
        output_channel: ["fitted_coefficients", "predictions"]
        stateful: false
      weight_solver:
        input_channel: ["specialist_forecasts", "targets"]
        output_channel: "weight_vector"
        stateful: false
    memory_architecture:
      per_agent_memory: "M_a"
      meta_memory: "M_meta"
      per_agent_learnings: "Z_a"
      meta_learnings: "Z_meta"
      shared_across_agents: false
      channel_1_cross_perspective: "scalar_losses_and_forecasts_only"  # [IMPLIED] — narrower than the original config's "scalar losses only"
      channel_2_memory_to_policy: "natural_language_prose"
      channel_1_property: "lossy_single_number_plus_vector"
      channel_2_property: "lossy_non_invertible_non_identifiable_language_channel"
  # SECTION 15.0 — TRAINING PARAMETERS
  training_parameters:
    mufasa_iterative_training:
      paradigm: "in_context_iteration_no_gradient_updates"
      weight_updates_on_backbone: false
      outer_iterations: 50  # [UNSPECIFIED IN MANUSCRIPT]
      per_agent_iterations: 50  # [UNSPECIFIED IN MANUSCRIPT]
      per_context_iterations: 30  # [UNSPECIFIED IN MANUSCRIPT]
    baseline_training:
      RandomForest:
        citation: "Breiman (2001)"
        n_trees: 500  # [UNSPECIFIED IN MANUSCRIPT]
        max_depth: null
