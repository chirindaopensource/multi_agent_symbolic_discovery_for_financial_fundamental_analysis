    min_denominator_tolerance: 1.0e-06  # [UNSPECIFIED IN MANUSCRIPT] admissible share-count floor
  perspectives: ["earnings", "cashflow", "asset", "growth", "quality"]  # [SPECIFIED Fig. 4] earnings, cash flow, asset, growth, quality
  perspective_agents:  # study_specification.perspective_agents; design_principle quoted from Appendix E
    earnings:
      name: "Earnings"
      theory_equation_latex: "\\frac{EPS}{r - g}"
      theory_label: "Gordon Growth"
      preferred_variables: ["NI_ps", "EPS_TTM", "P_E", "SECTOR_MEDIAN_PE", "IS_EPS_GROWTH_YOY"]
      structural_pattern: "earnings base x earnings multiple x bounded growth adjustment"
      design_principle: "Earnings-based models require sector-aware growth caps and bounded multiplicative structures to avoid systematic overprediction."
    cashflow:
      name: "Cash Flow"
      theory_equation_latex: "\\sum_{t=1}^{\\infty} \\frac{FCF_t}{(1+r)^t}"
      theory_label: "Discounted Cash Flow"
      preferred_variables: ["FCF_ps", "OCF_ps", "EV_EBITDA", "SECTOR_MEDIAN_EV_EBITDA", "EV_FCF"]
      structural_pattern: "cash-flow base x sector-adjusted multiple"
      design_principle: "Cash flow models require sector-aware adjustments, growth scaling, and explicit handling of negative cash flow to avoid systematic underestimation."
    asset:
      name: "Asset"
      theory_equation_latex: "BVPS \\cdot PB"
      theory_label: "Book Multiple"
      preferred_variables: ["BVPS", "TBVPS", "P_B", "SECTOR_MEDIAN_P_BOOK", "Assets", "Liabilities", "R&D"]
      structural_pattern: "book value x price-to-book x R&D-intensity adjustment"
      design_principle: "Asset-based models require bounded multiplicative structures, sector-specific adjustments, and controlled use of high-impact variables to avoid instability and invalid predictions."
    growth:
      name: "Growth"
      theory_equation_latex: "\\text{Revenue}_0 \\cdot (1 + g)"
      theory_label: "Revenue Growth"
      preferred_variables: ["Revenue_ps", "SALES_REV_TURN_YOY", "P_FCF_mkt", "FCF_ps"]
      structural_pattern: "base x growth factor or market-relative multiple"
      design_principle: "Growth-based models require sector-specific adjustments, growth elasticity, and bounded scaling to avoid instability and extreme prediction errors."
    quality:
      name: "Quality"
      theory_equation_latex: "BV + \\sum_{t=1}^{\\infty} \\frac{(ROE_t - r) \\cdot BV_{t-1}}{(1+r)^t}"
      theory_label: "Residual Income"
      preferred_variables: ["NI_ps", "EBIT_ps", "P_FCF", "ROE", "OCF_ps", "Assets"]
      structural_pattern: "earnings base x cash-flow multiple x ROE adjustment"
      design_principle: "Quality-based models require growth-aware scaling, bounded transformations, and sector-specific adjustments to balance stability and predictive performance."
