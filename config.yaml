  min_firms_per_sector_quarter: 5  # [UNSPECIFIED IN MANUSCRIPT] sector-median floor (task list: 5)
  min_cell_occupancy: 200  # [UNSPECIFIED IN MANUSCRIPT] context-cell floor, sector-pooled fallback below it
  min_firm_quarters: 200  # [UNSPECIFIED IN MANUSCRIPT] meta-coordinator occupancy floor
  train_fraction: 0.8  # [SPECIFIED §4] first 80% of quarters
  embargo_quarters: 1  # [REVISED: Added] one-quarter embargo
  fit_fraction: 0.9  # [UNSPECIFIED IN MANUSCRIPT] 90/10 fitting-validation carve-out of training
