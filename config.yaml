      index_ticker_verified: "^STOXX"  # [REVISED: Verified]
      trading_currency: "EUR"
    FTSE_APAC_EX_JP:
      index_name: "FTSE Asia Pacific ex-Japan"  # [SPECIFIED §4]
      span_start: "1996"  # [SPECIFIED §4]
      span_end: "2025"
      quarters_approx: 120
