    train_fraction: 0.8  # [SPECIFIED §4]
    test_fraction: 0.2  # [SPECIFIED §4]
    randomised: false
    validation_carveout_enabled: true  # [REVISED: Added]
    validation_fraction_of_train: 0.1  # [UNSPECIFIED IN MANUSCRIPT]
    embargo_enabled: true  # [REVISED: Added] — one-quarter embargo; label horizon overlaps test window without it
    embargo_quarters: 1  # [UNSPECIFIED IN MANUSCRIPT]
    freeze_system_at_train_end: true  # [REVISED: Added]
    no_feature_access_after_freeze: true  # [REVISED: Added]
    weight_estimation_subpartition: "training_window_only"  # [REVISED: Added] — weights fitted on training-only to avoid optimistic bias
    primary_metric: "MAPE"  # [SPECIFIED §4]
    secondary_metrics:  # [SPECIFIED Appx.G]
      - "SPEARMAN_RHO"
      - "P25_APE"
      - "MEDIAN_APE"
      - "P75_APE"
      - "P90_APE"
      - "P95_APE"
      - "WORST_DECILE_APE"
      - "MSPE_BY_PRICE_QUARTILE"
    aggregated_column_rules:  # [DERIVED]
      all_data: "unweighted_mean_of_five_market_values"
      avg_delta: "per_row_mean_of_five_gaps"
      mufasa_row_avg: "sum_of_17_margins_divided_by_17"
  inference_registry:
    test_name: "Diebold_Mariano"
    loss_function: "absolute_percentage_error"
    variance_estimator: "Newey_West_HAC"
    kernel: "Bartlett"
    bandwidth_rule: "Andrews"
    bandwidth_formula_verbatim: "floor(4 * (T/100)^(2/9))"
    small_sample_correction: "Harvey_Leybourne_Newbold"
    reference_distribution: "t_(T-1)"
    significance_markers: {"***": 0.001, "**": 0.01, "*": 0.05}
    sign_direction_convention: "mufasa_minus_baseline"
    extensions_added: ["TWO_WAY_CLUSTERING", "MULTIPLE_TESTING_CONTROL"]
