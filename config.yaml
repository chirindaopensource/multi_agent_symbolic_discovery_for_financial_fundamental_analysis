# ============================================================================
# STUDY SPECIFICATION — the complete MUFASA fused study configuration dictionary (sections 1.0
# to 29.0), every parameter verbatim with its provenance tag. It documents the study; the
# operational blocks above are the settings the stages read.
# ============================================================================
# MUFASA — FUSED STUDY CONFIGURATION DICTIONARY
# Self-Evolving Multi-Agent Symbolic Discovery for Financial Fundamental Analysis
# PURPOSE: Single canonical configuration object fusing (a) raw input schemas,
#          (b) all non-data-structure parameters, (c) prompt templates,
#          (d) architecture and training parameters, (e) plot construction
#          parameters, and (f) essential methodological notes.
# TAGGING CONVENTION APPLIED TO EVERY ENTRY:
#   [SPECIFIED]                  : paper states value/name/formula verbatim
#   [IMPLIED]                    : forced by released equations/tables/appendices
#   [CITED]                      : governed by a named external method
#   [DERIVED]                    : computed arithmetically from specified quantities
#   [REVISED: Added]             : added in this revision to close an audit gap
#   [REVISED: Clarified]         : disambiguated in this revision
#   [REVISED: Renamed]           : renamed in this revision
#   [UNSPECIFIED IN MANUSCRIPT]  : paper silent; this is a rational placeholder
#   [ABSENT]                     : confirmed not present anywhere in the paper
study_specification:
  # SECTION 1.0 — STUDY IDENTITY AND PROVENANCE
  study_identity:
    paper_title: "Self-Evolving Multi-Agent Symbolic Discovery for Financial Fundamental Analysis"  # [SPECIFIED]
    system_acronym: "MUFASA"  # [REVISED: Renamed] — corrected from "MUFAFA" to match the manuscript
    system_expansion: "Multi-Agent Fundamental Analysis with Symbolic Adaptive learning"  # [SPECIFIED]
    authors: ["Kelvin J.L. Koa", "Filip Orestav", "Shengqiong Wu", "Michael J. Wooldridge", "Ke-Wei Huang"]  # [SPECIFIED]
    affiliations:  # [SPECIFIED]
      - "National University of Singapore"
      - "Asian Institute of Digital Finance"
      - "KTH Royal Institute of Technology"
      - "University of Oxford"
    github_repository_url: null  # [ABSENT] no URL provided
    code_release_locator: null  # [ABSENT]
    artifact_release_promise_locations:  # [SPECIFIED]
      - "Abstract"
      - "Section 1 contributions list"
      - "Section 5 Released Artifacts"
      - "Section 6 Conclusion"
    artifact_actual_location: ["Appendix C", "Appendix D", "Appendix E"]  # [SPECIFIED]
    no_repository_statement: "The paper contains no GitHub URL, no repository name, and no code-availability locator."  # [ABSENT]
    config_version: "1.1.0-revised"  # [REVISED: Added] — provenance of this document
    config_hash_algorithm: "sha256"  # [REVISED: Added]
  # 1.2 Reproduction target hierarchy
  reproduction_target:
    tier_1_structural: "recover the five equation families per perspective per market"  # [GAP+RD]
    tier_2_directional: "MUFASA lower MAPE than all 17 baselines in all 5 markets"  # [GAP+RD]
    tier_3_quantitative: "reproduce Table 2 MAPE values within stochastic tolerance and Table 5 DM verdicts"  # [GAP+RD]
    stochasticity_sources:  # [IMPLIED]
      - "LLM hypothesis sampling (temperature 0.7)"
      - "differential evolution initialisation"
      - "LLM memory distillation (temperature 0.3)"
    single_run_insufficient: true  # [GAP+RD]
    seed_replicates: 5  # [UNSPECIFIED IN MANUSCRIPT] — rational default
    seed_values: [11, 23, 41, 67, 101]  # [UNSPECIFIED IN MANUSCRIPT]
    report_median_and_iqr_across_seeds: true  # [REVISED: Added]
    unreproducible_headline_claim_policy: "The paper's reported 19.65% average improvement is not exactly reconstructable from Table 2 or Table 5 under either pooled-vs-PySR (20.00%) or mean-per-market-vs-PySR (19.47%). The reproduction must declare its own aggregation basis, report its own computed value, and explicitly state that the paper's value is not verifiable from its published tables."  # [REVISED: Added]
  # SECTION 2.0 — GLOBAL STUDY CONSTANTS
  global_constants:
    metric_primary: "MAPE"  # [SPECIFIED §4]
    metric_lower_is_better: true  # [SPECIFIED §4]
    metric_reported_as: "decimal_fraction"  # [IMPLIED]
    metric_formula_reconstructed: "(1/N) * sum_i( abs(yhat_i - y_i) / abs(y_i) )"  # [IMPLIED Eq.3]
    loss_function_name: "absolute_percentage_error"  # [SPECIFIED Appx.B]
    aggregation_order_primary: "pooled"  # [UNSPECIFIED IN MANUSCRIPT] — paper does not declare; pooled is the natural reading of Table 2
    aggregation_orders_variants: ["pooled", "per_quarter_mean", "per_firm_mean"]  # [REVISED: Added] — all three must be computed as a reconciliation diagnostic
    aggregation_doctrine_note: "The paper's Table 2 differences are not reconcilable with its Table 5 DM differentials under any constant rescaling, indicating two different aggregation orders were likely used under the same metric name. The reproduction must compute both and diagnose which matches the reported numbers."  # [REVISED: Clarified]
    forecast_horizon_quarters: 1  # [SPECIFIED §4]
    forecast_resolution: "quarterly"  # [SPECIFIED §4]
    use_original_filings_only: true  # [SPECIFIED §4]
    restatements_allowed: false  # [SPECIFIED §4]
    lookahead_bias_prevention: true  # [SPECIFIED §4]
    survivorship_bias_prevention: true  # [SPECIFIED §4]
    monetary_units: "millions_reporting_currency"  # [IMPLIED]
    per_share_units: "reporting_currency_per_share"  # [IMPLIED]
    growth_units: "percent"  # [IMPLIED]
    price_units: "trading_currency"  # [REVISED: Clarified] — target is stated in the security's trading currency, not reporting currency
    ratio_units: "dimensionless"  # [IMPLIED]
    n_markets: 5  # [SPECIFIED]
    n_perspectives: 5  # [DERIVED]
    n_baselines_total: 17  # [DERIVED]
    n_baselines_by_family:  # [SPECIFIED §4]
      machine_learning: 3
      financial_llms: 2
      classical_valuation: 7
      symbolic_regression: 3
      agentic_finance: 2
  # SECTION 3.0 — RAW INPUT DATA STRUCTURE SCHEMAS
  raw_input_schemas:
    # 3.1 L1 — Firm-quarter fundamental extraction (Bloomberg)
    L1_fundamental_quarter:
      source_vendor: "Bloomberg"  # [SPECIFIED §4]
      grain: "issuer_id x fiscal_period_end"  # [IMPLIED §3.1]
      row_key: ["issuer_id", "fiscal_period_end"]  # [IMPLIED]
      currency_alignment_required: true  # [REVISED: Added] — reporting_currency vs trading_currency must be reconciled before any per-share or multiple use
      columns:
        # Identity block
        issuer_id: {dtype: "object", source: "[IMPLIED]"}
        isin: {dtype: "object", source: "[IMPLIED]"}
        cusip: {dtype: "object", storage: "string", source: "[IMPLIED]"}  # leading zeros meaningful
        sedol: {dtype: "object", source: "[IMPLIED]"}
        ticker: {dtype: "object", source: "[IMPLIED]", note: "NOT a safe join key."}  # [REVISED: Clarified]
        company_name: {dtype: "object", source: "[IMPLIED]"}
        reporting_currency: {dtype: "object", source: "[IMPLIED]"}
        trading_currency: {dtype: "object", source: "[REVISED: Added]"}
        fx_reporting_to_trading_rate: {dtype: "float64", source: "[REVISED: Added]"}
        country_of_incorporation: {dtype: "object", source: "[IMPLIED]"}
        country_of_listing: {dtype: "object", source: "[IMPLIED]"}
        gics_sector_code: {dtype: "object", storage: "string", source: "[IMPLIED]"}
        gics_sector_name: {dtype: "object", source: "[IMPLIED]"}
        gics_industry_group_code: {dtype: "object", source: "[IMPLIED]"}
        gics_industry_group_name: {dtype: "object", source: "[IMPLIED]"}
        gics_classification_effective_date: {dtype: "datetime64[ns]", source: "[REVISED: Added]"}
        gics_sector_code_effective:
          dtype: "object"
          source: "[REVISED: Added]"
          note: "The sector code in force at fiscal_period_end; the field used for C(i,t)."
        # Period/timing block
        fiscal_period_end: {dtype: "datetime64[ns]", source: "[SPECIFIED]"}
        fiscal_quarter_label:
          dtype: "object"
          source: "[IMPLIED]"
          note: "All lag construction uses this, not date differences."
        fiscal_year: {dtype: "int64", source: "[IMPLIED]"}
        fiscal_quarter_number:
          dtype: "int64"
          domain: [1, 2, 3, 4]
          source: "[IMPLIED]"
        filing_date_original: {dtype: "datetime64[ns]", source: "[SPECIFIED]", note: "THE LOOK-AHEAD GATE."}
        filing_date_latest_restated:
          dtype: "datetime64[ns]"
          source: "[IMPLIED]"
          note: "Present so that it can be EXCLUDED."
        flag_restatement_audit_diff:
          dtype: "int64"
          source: "[REVISED: Added]"
          note: "1 if current values differ from as-originally-filed snapshot."
        filing_type: {dtype: "object", source: "[IMPLIED]"}
        period_type:
          dtype: "object"
          domain: ["QUARTERLY", "TTM"]
          source: "[IMPLIED]"
        # Income statement block (all values in millions of reporting currency unless noted)
        is_revenue_q: {dtype: "float64", source: "[IMPLIED]"}
        is_cost_of_revenue_q: {dtype: "float64", source: "[IMPLIED]"}
        is_gross_profit_q: {dtype: "float64", source: "[IMPLIED]"}
        is_operating_income_q: {dtype: "float64", source: "[IMPLIED]"}
        is_ebit_q: {dtype: "float64", source: "[IMPLIED]"}
        is_ebitda_q: {dtype: "float64", source: "[IMPLIED]"}
        is_net_income_q: {dtype: "float64", source: "[IMPLIED]"}
        is_eps_basic_q: {dtype: "float64", source: "[IMPLIED]"}
        is_eps_diluted_q: {dtype: "float64", source: "[IMPLIED]"}
        is_interest_expense_q: {dtype: "float64", source: "[IMPLIED]"}
        is_interest_income_q: {dtype: "float64", source: "[IMPLIED]"}
        is_income_tax_expense_q: {dtype: "float64", source: "[IMPLIED]"}
        is_rd_expense_q: {dtype: "float64", source: "[IMPLIED]"}
        is_sga_q: {dtype: "float64", source: "[IMPLIED]"}
        # TTM block
        is_revenue_ttm: {dtype: "float64", source: "[IMPLIED]"}
        is_net_income_ttm: {dtype: "float64", source: "[IMPLIED]"}
        is_eps_ttm:
          dtype: "float64"
          source: "[IMPLIED]"
          note: "Vendor-weighted; distinct from is_net_income_ttm / bs_shares_outstanding."
        bs_shares_outstanding_weighted_avg_ttm:
          dtype: "float64"
          source: "[REVISED: Added]"
          note: "Time-weighted share count underlying is_eps_ttm."
        is_ebit_ttm: {dtype: "float64", source: "[IMPLIED]"}
        is_ebitda_ttm: {dtype: "float64", source: "[IMPLIED]"}
        is_rd_expense_ttm: {dtype: "float64", source: "[IMPLIED]"}
        # Cash flow block
        cf_operating_cash_flow_ttm: {dtype: "float64", source: "[IMPLIED]"}
        cf_capital_expenditure_ttm: {dtype: "float64", source: "[IMPLIED]"}
        cf_free_cash_flow_ttm:
          dtype: "float64"
          source: "[IMPLIED]"
          note: "MAY BE NEGATIVE; naive truncation causes systematic underestimation."
        cf_dividends_paid_ttm: {dtype: "float64", source: "[IMPLIED]"}
        cf_depreciation_amortization_ttm: {dtype: "float64", source: "[IMPLIED]"}
        cf_cash_from_investing_ttm: {dtype: "float64", source: "[IMPLIED]"}
        cf_cash_from_financing_ttm: {dtype: "float64", source: "[IMPLIED]"}
        # Balance sheet block (point-in-time)
        bs_total_assets: {dtype: "float64", source: "[IMPLIED]"}
        bs_current_assets: {dtype: "float64", source: "[IMPLIED]"}
        bs_cash_and_equivalents: {dtype: "float64", source: "[IMPLIED]"}
        bs_total_liabilities: {dtype: "float64", source: "[IMPLIED]"}
        bs_current_liabilities:
          dtype: "float64"
          source: "[IMPLIED]"
          note: "Learnings warn against using as denominator in asset-light firms."
        bs_total_debt:
          dtype: "float64"
          source: "[IMPLIED]"
          note: "Interest-bearing only; excludes operating-lease liabilities under US GAAP pre-2019, includes them under IFRS 16."
        bs_total_debt_convention:
          dtype: "object"
          domain: ["IB+leases", "IB_only", "vendor_unspecified"]
          source: "[REVISED: Added]"
        bs_long_term_investments: {dtype: "float64", source: "[SPECIFIED Table 7]"}
        bs_goodwill_and_intangibles: {dtype: "float64", source: "[IMPLIED]"}
        bs_goodwill_separable: {dtype: "float64", source: "[REVISED: Added]"}
        bs_total_equity: {dtype: "float64", source: "[IMPLIED]"}
        bs_total_equity_convention:
          dtype: "object"
          domain: ["common", "incl_nci"]
          source: "[REVISED: Added]"
        bs_shares_outstanding: {dtype: "float64", source: "[IMPLIED]"}
        # Vendor market snapshot
        px_close_period_end:
          dtype: "float64"
          source: "[SPECIFIED]"
          note: "NOT the target; forward-shift required."
        px_split_adjustment_reference_date: {dtype: "datetime64[ns]", source: "[REVISED: Added]"}
        market_cap_period_end: {dtype: "float64", source: "[IMPLIED]"}
        market_cap_period_end_share_basis:
          dtype: "object"
          domain: ["period_end_shares", "weighted_shares"]
          source: "[REVISED: Added]"
        # Raw data-quality flags
        flag_restatement_pending: {dtype: "bool", source: "[IMPLIED]", note: "Does NOT trigger value replacement."}
        flag_fiscal_year_change:
          dtype: "bool"
          source: "[IMPLIED]"
          note: "Breaks fixed lag structure; exclude from lag construction."
        n_missing_fields: {dtype: "int64", source: "[IMPLIED]"}
      excluded_downstream_columns:
        note: "Computed downstream; must not appear in the raw panel."
        per_share_derivations:
          - "NI_ps"
          - "EPS_TTM"
          - "FCF_ps"
          - "OCF_ps"
          - "EBITDA_ps"
          - "EBIT_ps"
          - "Revenue_ps"
          - "BVPS"
          - "TBVPS"
          - "Debt_ps"
        firm_level_multiples: ["P_E", "P_B", "P_FCF", "P_OCF", "EV_EBIT", "EV_EBITDA", "EV_FCF", "EV_Sales"]
        cross_sectional_aggregates:
          - "PB_mkt"
          - "PB_mkt_mean"
          - "PB_mkt_median"
          - "PB_mkt_std"
          - "P_FCF_mkt"
          - "P_SALES_mkt"
          - "EV_FCF_mkt"
          - "EV_EBITDA_mkt"
        sector_aggregates:
          - "SECTOR_MEDIAN_PE"
          - "SECTOR_MEDIAN_EV_EBITDA"
          - "SECTOR_MEDIAN_P_BOOK"
          - "SECTOR_MEDIAN_P_FCF"
          - "SECTOR_MEDIAN_EV_EBIT"
          - "sigma_EV_EBIT"
        growth_fields: ["g_EPS", "g_Revenue", "g_EBITDA", "g_EBIT", "SustGrowth"]
        lagged_fields:
          - "BVPS_lag1"
          - "BVPS_lag4"
          - "EPS_lag1"
          - "OCF_ps_lag1"
          - "Assets_lag4"
          - "ROE_lag8"
          - "SALES_REV_TURN_TTM_LAG4"
        engineered_flags: ["NEGATIVE_CASH_FLOW_FACTOR", "CONSUMER_DISCRETIONARY_FLAG"]
        return_metrics: ["ROE", "RETURN_COM_EQY", "payout_ratio_ttm"]
        target_and_context: ["y_next_quarter_price", "context_key", "regime_state", "in_index"]
    # 3.2 L2 — Macro extraction (FactSet)
    L2_macro_quarter:
      source_vendor: "FactSet"  # [SPECIFIED §4]
      grain: "calendar_quarter_end_per_market"  # [REVISED: Clarified] — the original specification used a single global series; per-market resolution is required
      join_key: "cal_quarter -> fiscal_period_end via calendar mapping"
      publication_lag_enforced: true  # [REVISED: Added]
      columns:
        cal_quarter: {dtype: "object", source: "[IMPLIED]"}
        cal_period_end: {dtype: "datetime64[ns]", source: "[IMPLIED]"}
        publication_date: {dtype: "datetime64[ns]", source: "[REVISED: Added]"}
        vintage:
          dtype: "object"
          domain: ["initial_release", "latest_revision"]
          source: "[REVISED: Added]"
        flag_macro_revision_applied: {dtype: "int64", source: "[REVISED: Added]"}
        y_30_us: {dtype: "float64", units: "percent", source: "[SPECIFIED §4, Table 4]"}
        y_30_de: {dtype: "float64", units: "percent", source: "[REVISED: Added]"}
        y_30_gb: {dtype: "float64", units: "percent", source: "[REVISED: Added]"}
        y_30_cn: {dtype: "float64", units: "percent", source: "[REVISED: Added]"}
        y_30_local:
          dtype: "float64"
          units: "percent"
          source: "[REVISED: Added]"
          note: "Market-resolved accessor; joins on market_id."
        y_10_us: {dtype: "float64", source: "[IMPLIED]"}
        y_10_de: {dtype: "float64", source: "[IMPLIED]"}
        y_10_gb: {dtype: "float64", source: "[IMPLIED]"}
        y_10_cn: {dtype: "float64", source: "[IMPLIED]"}
        y_5_us: {dtype: "float64", source: "[IMPLIED]"}
        y_2_us: {dtype: "float64", source: "[IMPLIED]"}
        y_3m_us: {dtype: "float64", source: "[IMPLIED]"}
        cpi_yoy: {dtype: "float64", source: "[IMPLIED]"}
        ppi_yoy: {dtype: "float64", source: "[IMPLIED]"}
        industrial_production_yoy: {dtype: "float64", source: "[IMPLIED]"}
        unemployment_rate: {dtype: "float64", source: "[IMPLIED]"}
        real_gdp_growth_yoy: {dtype: "float64", source: "[IMPLIED]"}
        credit_spread_ig: {dtype: "float64", source: "[IMPLIED]"}
        credit_spread_hy: {dtype: "float64", source: "[REVISED: Added]"}
        vix_quarter_mean: {dtype: "float64", source: "[IMPLIED]"}
        fx_trade_weighted_index: {dtype: "float64", source: "[IMPLIED]"}
        commodity_index: {dtype: "float64", source: "[IMPLIED]"}
        term_spread_30_3m: {dtype: "float64", source: "[REVISED: Added]"}
        real_yield_10: {dtype: "float64", source: "[REVISED: Added]"}
      macro_inventory_completeness: "[ABSENT] full inventory unpublished; only y_30 confirmed in the paper."
      usable_by_mufasa_agents: "[UNSPECIFIED IN MANUSCRIPT] — no released MUFASA equation references any macro variable; only the PySR baseline uses y_30. Default: offer all fields to the search; empirically reject via coverage check."  # [REVISED: Added]
    # 3.3 L3 — Index price series (Yahoo Finance)
    L3_index_daily:
      source_vendor: "Yahoo Finance"  # [SPECIFIED §4]
      grain: "index_ticker x trading_date"  # [IMPLIED]
      frequency_default: "daily"  # [IMPLIED] — required for ±20% threshold rule
      ticker_map_reconstruction:  # [REVISED: Verified]
        SP500: "^GSPC"
        RUSSELL2000: "^RUT"
        STOXX600: "^STOXX"
        FTSE_APAC_EX_JP: null  # [REVISED: Added] — the original '^FTAPEXJ' is not a valid Yahoo Finance identifier; must be verified and set to a valid symbol
        CSI300: "000300.SS"
      ticker_verification_required: true  # [REVISED: Added]
      columns:
        index_ticker: {dtype: "object", source: "[IMPLIED]"}
        ticker_verified: {dtype: "bool", source: "[REVISED: Added]"}
        trading_date: {dtype: "datetime64[ns]", source: "[IMPLIED]"}
        open: {dtype: "float64", source: "[IMPLIED]"}
        high: {dtype: "float64", source: "[IMPLIED]"}
        low: {dtype: "float64", source: "[IMPLIED]"}
        close:
          dtype: "float64"
          source: "[SPECIFIED by implication]"
          note: "THE operative field for regime dating."
        adj_close:
          dtype: "float64"
          source: "[IMPLIED]"
          note: "MUST NOT be used for regime dating; backward-adjusted."
        volume: {dtype: "float64", source: "[IMPLIED]"}
        currency: {dtype: "object", source: "[IMPLIED]"}
        trading_calendar_id: {dtype: "object", source: "[REVISED: Added]"}
    # 3.4 L4a — Index membership history
    L4a_index_membership:
      source: "Bloomberg constituent history"  # [SPECIFIED §4]
      grain: "index_name x issuer_id x interval"  # [SPECIFIED]
      specified_statement: "constituent entry and exit dates included to prevent survivorship bias"  # [SPECIFIED §4]
      columns:
        index_name: {dtype: "object", source: "[SPECIFIED]"}
        issuer_id: {dtype: "object", source: "[SPECIFIED]"}
        entry_date: {dtype: "datetime64[ns]", source: "[SPECIFIED]"}
        exit_date: {dtype: "datetime64[ns]", nullable: true, source: "[SPECIFIED]", note: "NaT for ongoing members."}
        exit_reason:
          dtype: "object"
          nullable: true
          domain: ["DELISTED", "ACQUIRED", "REMOVED_MARKETCAP", "INDEX_REBALANCE"]
          source: "[REVISED: Clarified]"
          note: "If every exit reason is a rebalance and none are delistings, the extract is suspect."
        methodology_version: {dtype: "object", source: "[REVISED: Added]"}
        membership_interval_unique: {dtype: "bool", source: "[REVISED: Added]"}
        source_extract_date: {dtype: "datetime64[ns]", source: "[REVISED: Added]"}
      derived_downstream: ["in_index_at_period_end"]
    # 3.5 L4b — Sector taxonomy reference
    L4b_sector_taxonomy:
      taxonomy: "GICS 11-sector"  # [IMPLIED] Figure 6, Appendix G
      n_sectors: 11  # [DERIVED]
      paper_consistent_labels:  # [SPECIFIED Figure 6]
        - "Communications"
        - "Consumer Discretionary"
        - "Consumer Staples"
        - "Energy"
        - "Financials"
        - "Health Care"
        - "Industrials"
        - "Materials"
        - "Real Estate"
        - "Technology"
        - "Utilities"
      gics_to_paper_mapping:
        "Communication Services": "Communications"  # [REVISED: Added]
        "Information Technology": "Technology"  # [REVISED: Added]
        "Telecommunication Services": "Communications"  # [REVISED: Added] GICS continuity: the pre-September-2018 name of sector code 50
        all_others: "identity"
    # 3.6 L5 — Identifier crosswalk
    L5_identifier_crosswalk:
      grain: "issuer_id"  # [IMPLIED]
      columns:
        isin: {dtype: "object_or_null"}
        cusip: {dtype: "object_or_null", storage: "string"}
        sedol: {dtype: "object_or_null"}
        figi: {dtype: "object"}
        vendor_ids: {dtype: "dict"}
        valid_from: {dtype: "date"}
        valid_to: {dtype: "date_or_null"}
  # SECTION 4.0 — DATA ENGINEERING AND PREPROCESSING
  data_engineering:
    fundamental_vendor: "Bloomberg"  # [SPECIFIED §4]
    macro_vendor: "FactSet"  # [SPECIFIED §4]
    index_price_vendor: "Yahoo Finance"  # [SPECIFIED §4]
    panel_grain: "firm_x_fiscal_quarter"  # [IMPLIED]
    target_field: "price_at_next_fiscal_quarter_end"  # [SPECIFIED §4]
    feature_timestamp_field: "fiscal_period_end"  # [IMPLIED]
    target_timestamp_field: "next_fiscal_quarter_end"  # [IMPLIED]
    target_construction_rule: "y_{i,t+1} is the split-adjusted closing price at the end of the NEXT fiscal quarter. It is obtained by a forward-shift on the panel. px_close_period_end is NOT the target."  # [REVISED: Clarified] — mechanically enforced
    as_of_rule: "filing_date_original <= decision_date"  # [SPECIFIED §4]
    feature_admission_gate: "coverage >= threshold"  # [IMPLIED]
    price_adjustment_split: true  # [IMPLIED]
    price_adjustment_dividend: false  # [REVISED: Clarified] — index-level adjustment excluded from regime dating
    adjustment_consistency_required: true  # [IMPLIED]
    split_adjustment_basis_date_audit_required: true  # [REVISED: Added] — required to prevent split-adjustment leak into forward-shifted target
    missing_target_policy: "drop_row"  # [UNSPECIFIED IN MANUSCRIPT] — default
    missing_feature_policy: "retrieval_failure_feedback"  # [IMPLIED §3.2]
    ratio_denominator_nonpositive_policy: "set_missing"  # [UNSPECIFIED IN MANUSCRIPT] — default; do not silently abs or sign-flip
    structural_zero_preserved: true  # [IMPLIED]
    winsorise_target: false  # [UNSPECIFIED IN MANUSCRIPT] — default
    winsorise_ratio_features: true  # [UNSPECIFIED IN MANUSCRIPT] — default
    winsorise_lower_pct: 0.01  # [UNSPECIFIED IN MANUSCRIPT] — default
    winsorise_upper_pct: 0.99  # [UNSPECIFIED IN MANUSCRIPT] — default
    winsorise_application_stage: "post_feature_construction_pre_DE"  # [REVISED: Clarified] — order of operations must be declared
    coverage_threshold_train: 0.8  # [UNSPECIFIED IN MANUSCRIPT] — default
    coverage_window: "training_partition"  # [UNSPECIFIED IN MANUSCRIPT] — default
    coverage_field_definition: "fraction_non_missing"  # [IMPLIED]
    macro_publication_lag_enforced: true  # [REVISED: Added]
    macro_vintage_initial_release_required: true  # [REVISED: Added]
    panel_internal_consistency_checks:  # [REVISED: Added] — Gate 0
      accounting_identity: "|bs_total_assets - (bs_total_liabilities + bs_total_equity)| < 1e-3 * bs_total_assets"
      target_strictly_after_filing: "target_date > filing_date_original"
      market_cap_reconciliation: "|market_cap_period_end - px_close_period_end * bs_shares_outstanding| / market_cap_period_end < 2e-2"
      target_forward_shift_lock: "target_date == next_fiscal_quarter_end"
