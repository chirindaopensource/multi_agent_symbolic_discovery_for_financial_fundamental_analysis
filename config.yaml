    - path: "packaging.page_size"
      tag: "[UNSPECIFIED IN MANUSCRIPT]"
      decision: "recorded"
      justification: "The learnings-history page size is a packaging decision."
  ftse_candidate_symbols: ["^FTAPXJ", "^FTSEAPXJ", "FTAWXJ", "^FTASIAPXJ"]
# ============================================================================
# TASK 4 — restatement discipline, structural zeros, denominators and Gate 0
# ============================================================================
cleaning:
  ratio_specs:  # [IMPLIED] the ten declared ratios as (numerator, denominator) panel columns
    pe: ["market_cap_period_end", "is_net_income_ttm"]
    pb: ["market_cap_period_end", "bs_total_equity"]
    pfcf: ["market_cap_period_end", "cf_free_cash_flow_ttm"]
    pocf: ["market_cap_period_end", "cf_operating_cash_flow_ttm"]
    ev_ebit: ["enterprise_value", "is_ebit_ttm"]
    ev_ebitda: ["enterprise_value", "is_ebitda_ttm"]
    ev_fcf: ["enterprise_value", "cf_free_cash_flow_ttm"]
    ev_sales: ["enterprise_value", "is_revenue_ttm"]
    roe: ["is_net_income_ttm", "bs_total_equity"]
    payout: ["cf_dividends_paid_ttm", "is_net_income_ttm"]
  max_failure_fraction: 0.05  # [REVISED: Added] Gate 0 systematic-failure halt (5%)
  warn_threshold: 0.02  # [REVISED: Added] restatement audit-rate warning (2%)
# ============================================================================
# MACRO — yields joined by (market, quarter) for Tasks 22 and 25
# ============================================================================
