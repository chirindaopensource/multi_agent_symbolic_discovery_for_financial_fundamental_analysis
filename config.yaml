    crossover_rate: 0.7
    differential_weight: 0.5
    parameter_bounds: [-1000000.0, 1000000.0]
    early_stop_patience: 20
    early_stop_tolerance: 1.0e-06
    admissible_share_floor: 0.5  # Task 16 default: half the training rows admissible
  operator_whitelist: ["+", "-", "*", "/", "^", "log", "exp", "abs", "<", ">", "indicator"]  # [REVISED: Added] output_grammar.operators_allowed
  max_operators: 30  # [REVISED: Added] output_grammar.max_operators
  memory_cap: 500  # [UNSPECIFIED IN MANUSCRIPT] statistical memory cap (records)
  weight_constraint: "simplex"  # [SPECIFIED §3.3] simplex: non-negative, sum to one
